server:
  port: 8761

spring:
  application:
    name: Joytishcharya-EurekaServer

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
    eureka:
      instance:
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90

        spring:
          cloud:
            openfeign:
              client:
                config:
                  default:
                    connectTimeout: 5000
                    readTimeout: 5000
