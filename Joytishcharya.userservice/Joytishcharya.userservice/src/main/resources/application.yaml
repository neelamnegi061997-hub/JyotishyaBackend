server:
  port: 8081

spring:
  application:
    name: JOYTISHCHARYA.USERSERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev me update use kar sakte ho
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: jyotishcharya

  config:
    import: configserver:http://localhost:8888

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
